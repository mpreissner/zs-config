[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zs-config"
version = "3.6.4"
description = "Interactive TUI for Zscaler OneAPI automation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.33.0",
    "certifi>=2026.10.23",
    "truststore>=0.9.0",
    "zscaler-sdk-python>=1.9.39",
    "rich>=13.7.0",
    "questionary>=2.0.0",
    "pyfiglet>=1.0.2",
    "sqlalchemy>=2.0.0",
    "cryptography>=46.0.6",
    "webauthn>=2.0.0",
    "sqlcipher3>=0.5.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "bcrypt>=4.0.0",
    "PyJWT[crypto]>=2.10.0",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10.0,<4.0",
    "croniter>=1.4.0",
    # SAML 2.0 SP. xmlsec ships wheels; building from source needs libxmlsec1 headers.
    "python3-saml>=1.16.0",
    # ACME client for Let's Encrypt issuance (dns-01 only). Pure Python.
    "acme>=2.9.0",
]

[project.scripts]
zs-config = "cli.z_config:main"

[tool.setuptools.packages.find]
include = ["cli*", "db*", "lib*", "services*", "api*"]
