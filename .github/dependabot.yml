version: 2
updates:
  # Base image digests. This is how OS security fixes reach the image now that
  # the tags are pinned; new Python and Node versions stay a deliberate change.
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  - package-ecosystem: npm
    directory: /web
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      web-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
